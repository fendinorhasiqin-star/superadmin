<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log Aktivitas - Superadmin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" data-active="log"></aside>

    <main class="main">
      <h2>Log Aktivitas</h2>
      <p class="subtitle">Catatan siapa melakukan apa dan kapan.</p>

      <div style="margin-bottom:14px">
        <button class="btn danger" id="btn-clear">Hapus semua log</button>
      </div>

      <div class="card" id="log-table"></div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/log.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    Auth.requireLogin("../");
    renderSidebar("../", "");

    function render() {
      const logs = Log.all();
      const box = document.getElementById("log-table");
      if (!logs.length) {
        box.innerHTML = '<div class="empty">Belum ada aktivitas.</div>';
        return;
      }
      box.innerHTML =
        "<table><thead><tr><th>Waktu</th><th>Aksi</th><th>Detail</th></tr></thead><tbody>" +
        logs
          .map(
            (l) =>
              `<tr><td>${new Date(l.time).toLocaleString("id-ID")}</td>
               <td>${escapeHtml(l.action)}</td>
               <td>${escapeHtml(l.detail)}</td></tr>`
          )
          .join("") +
        "</tbody></table>";
    }

    document.getElementById("btn-clear").addEventListener("click", () => {
      if (confirm("Hapus semua log aktivitas?")) {
        Log.clear();
        render();
      }
    });

    render();
  </script>
</body>
</html>
