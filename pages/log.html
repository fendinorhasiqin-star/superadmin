<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Log Aktivitas - Superadmin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebar" data-active="log"></nav>

    <main class="main">
      <h2>Log Aktivitas</h2>
      <p class="subtitle">Catatan siapa melakukan apa dan kapan (disimpan di browser ini).</p>

      <div style="margin-bottom:14px">
        <button class="btn danger block" id="btn-clear">Hapus semua log</button>
      </div>

      <div class="card flush" id="log-table"></div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/firebase.js"></script>
  <script src="../js/log.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    Auth.requireLogin("../").then((user) => {
      if (!user) return;
      renderSidebar("../", "");

      function render() {
        const logs = Log.all();
        const box = document.getElementById("log-table");
        if (!logs.length) {
          box.innerHTML = '<div class="empty">Belum ada aktivitas.</div>';
          return;
        }
        box.innerHTML =
          '<div class="list">' +
          logs.map((l) =>
            `<div class="list-item"><div class="t">${new Date(l.time).toLocaleString("id-ID")}</div><div class="a">${escapeHtml(l.action)}</div><div class="d">${escapeHtml(l.detail)}</div></div>`
          ).join("") + "</div>";
      }

      document.getElementById("btn-clear").addEventListener("click", () => {
        if (confirm("Hapus semua log aktivitas?")) {
          Log.clear();
          render();
        }
      });

      render();
    });
  </script>
</body>
</html>
