<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log Aktivitas - Superadmin</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --ok: #16a34a;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a { color: var(--primary); text-decoration: none; }

    /* ---------- Layout ---------- */
    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 230px;
      background: #111827;
      color: #fff;
      padding: 20px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .sidebar h1 { font-size: 18px; margin: 0 8px 20px; }
    .sidebar a {
      display: block;
      color: #d1d5db;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .sidebar a:hover, .sidebar a.active { background: #1f2937; color: #fff; }
    .sidebar .logout { margin-top: 24px; color: #fca5a5; cursor: pointer; }

    .main { flex: 1; padding: 28px; max-width: 1100px; }
    .main h2 { font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: var(--muted); margin-bottom: 22px; font-size: 14px; }

    /* ---------- Komponen ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .app-card h3 { font-size: 16px; margin-bottom: 4px; }
    .app-card p { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .app-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .badge.ok { background: #dcfce7; color: var(--ok); }
    .badge.off { background: #fee2e2; color: var(--danger); }

    .btn {
      display: inline-block;
      border: none;
      background: var(--primary);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn.secondary { background: #e5e7eb; color: var(--text); }
    .btn.secondary:hover { background: #d1d5db; }
    .btn.danger { background: var(--danger); }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      background: #fff;
    }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .stat .num { font-size: 28px; font-weight: 700; }
    .stat .lbl { color: var(--muted); font-size: 13px; }

    .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; }

    /* ---------- Login ---------- */
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-box { width: 100%; max-width: 380px; }
    .login-box h1 { margin-bottom: 4px; font-size: 22px; }
    .error { color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 18px; }

    @media (max-width: 760px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .sidebar h1 { width: 100%; }
      .sidebar .logout { margin-top: 0; }
      .main { padding: 18px; }
    }

    /* Atribut hidden harus selalu menyembunyikan elemen */
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" data-active="log"></aside>

    <main class="main">
      <h2>Log Aktivitas</h2>
      <p class="subtitle">Catatan siapa melakukan apa dan kapan (disimpan di browser ini).</p>

      <div style="margin-bottom:14px">
        <button class="btn danger" id="btn-clear">Hapus semua log</button>
      </div>

      <div class="card" id="log-table" style="overflow-x:auto"></div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/firebase.js"></script>
  <script src="../js/log.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    Auth.requireLogin("../").then((user) => {
      if (!user) return;
      renderSidebar("../", "");

      function render() {
        const logs = Log.all();
        const box = document.getElementById("log-table");
        if (!logs.length) {
          box.innerHTML = '<div class="empty">Belum ada aktivitas.</div>';
          return;
        }
        box.innerHTML =
          "<table><thead><tr><th>Waktu</th><th>Aksi</th><th>Detail</th></tr></thead><tbody>" +
          logs
            .map(
              (l) =>
                `<tr><td>${new Date(l.time).toLocaleString("id-ID")}</td>
                 <td>${escapeHtml(l.action)}</td>
                 <td>${escapeHtml(l.detail)}</td></tr>`
            )
            .join("") +
          "</tbody></table>";
      }

      document.getElementById("btn-clear").addEventListener("click", () => {
        if (confirm("Hapus semua log aktivitas?")) {
          Log.clear();
          render();
        }
      });

      render();
    });
  </script>
</body>
</html>
