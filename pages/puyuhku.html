<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Puyuhku - Superadmin</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --ok: #16a34a;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a { color: var(--primary); text-decoration: none; }

    /* ---------- Layout ---------- */
    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 230px;
      background: #111827;
      color: #fff;
      padding: 20px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .sidebar h1 { font-size: 18px; margin: 0 8px 20px; }
    .sidebar a {
      display: block;
      color: #d1d5db;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .sidebar a:hover, .sidebar a.active { background: #1f2937; color: #fff; }
    .sidebar .logout { margin-top: 24px; color: #fca5a5; cursor: pointer; }

    .main { flex: 1; padding: 28px; max-width: 1100px; }
    .main h2 { font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: var(--muted); margin-bottom: 22px; font-size: 14px; }

    /* ---------- Komponen ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .app-card h3 { font-size: 16px; margin-bottom: 4px; }
    .app-card p { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .app-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .badge.ok { background: #dcfce7; color: var(--ok); }
    .badge.off { background: #fee2e2; color: var(--danger); }

    .btn {
      display: inline-block;
      border: none;
      background: var(--primary);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn.secondary { background: #e5e7eb; color: var(--text); }
    .btn.secondary:hover { background: #d1d5db; }
    .btn.danger { background: var(--danger); }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      background: #fff;
    }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .stat .num { font-size: 28px; font-weight: 700; }
    .stat .lbl { color: var(--muted); font-size: 13px; }

    .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; }

    /* ---------- Login ---------- */
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-box { width: 100%; max-width: 380px; }
    .login-box h1 { margin-bottom: 4px; font-size: 22px; }
    .error { color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 18px; }

    @media (max-width: 760px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .sidebar h1 { width: 100%; }
      .sidebar .logout { margin-top: 0; }
      .main { padding: 18px; }
    }

    /* Atribut hidden harus selalu menyembunyikan elemen */
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" data-active="puyuhku"></aside>

    <main class="main">
      <h2>Data Puyuhku</h2>
      <p class="subtitle">Data dari Firebase puyuhku. Hanya untuk dilihat, tidak bisa diubah dari sini.</p>

      <h3 style="margin-bottom:12px">Pengguna</h3>
      <div class="card" id="users-box" style="overflow-x:auto">
        <div class="empty">Memuat...</div>
      </div>

      <h3 style="margin:22px 0 12px">Data per pengguna</h3>
      <div class="card">
        <label for="sub-name">Jenis data</label>
        <select id="sub-name"></select>
        <div id="detail-box" style="overflow-x:auto">
          <div class="empty">Pilih pengguna dari daftar di atas.</div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/firebase.js"></script>
  <script src="../js/log.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/services/base.js"></script>
  <script src="../js/services/puyuhku.js"></script>
  <script>
    Auth.requireLogin("../").then((user) => {
      if (!user) return;
      renderSidebar("../", "");

      const svc = window.Services.puyuhku;
      const usersBox = document.getElementById("users-box");
      const detailBox = document.getElementById("detail-box");
      let selectedUid = null;

      // Isi pilihan jenis data dari config.js (app.subcollections)
      document.getElementById("sub-name").innerHTML = (svc.app.subcollections || [])
        .map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`)
        .join("");

      // Tampilkan nilai apa pun dengan rapi (tanggal Firestore, objek, dll.)
      function fmt(v) {
        if (v === null || v === undefined) return "-";
        if (typeof v.toDate === "function") return v.toDate().toLocaleString("id-ID");
        if (typeof v === "object") return JSON.stringify(v);
        return String(v);
      }

      // Buat tabel otomatis dari daftar dokumen. actionFn opsional: kolom tombol.
      function tableOf(rows, actionFn) {
        const cols = ["id"];
        rows.forEach((r) =>
          Object.keys(r).forEach((k) => {
            if (!cols.includes(k)) cols.push(k);
          })
        );
        return (
          "<table><thead><tr>" +
          cols.map((c) => `<th>${escapeHtml(c)}</th>`).join("") +
          (actionFn ? "<th></th>" : "") +
          "</tr></thead><tbody>" +
          rows
            .map(
              (r) =>
                "<tr>" +
                cols.map((c) => `<td>${escapeHtml(fmt(r[c]))}</td>`).join("") +
                (actionFn ? `<td>${actionFn(r)}</td>` : "") +
                "</tr>"
            )
            .join("") +
          "</tbody></table>"
        );
      }

      async function loadUsers() {
        try {
          const users = await svc.listUsers();
          if (!users.length) {
            usersBox.innerHTML =
              '<div class="empty">Belum ada data di subkoleksi puyuhku.</div>';
            return;
          }
          usersBox.innerHTML = tableOf(
            users,
            (u) => `<button class="btn secondary" data-uid="${escapeHtml(u.id)}">Lihat</button>`
          );
        } catch (e) {
          usersBox.innerHTML =
            '<div class="empty">Gagal memuat: ' + escapeHtml(e.message) + "</div>";
        }
      }

      async function loadDetail() {
        const name = document.getElementById("sub-name").value.trim();
        if (!selectedUid || !name) return;
        detailBox.innerHTML = '<div class="empty">Memuat...</div>';
        try {
          const rows = await svc.listSub(selectedUid, name);
          Log.add("lihat_data", `Melihat ${name} milik user ${selectedUid}`);
          detailBox.innerHTML = rows.length
            ? `<p class="subtitle">${rows.length} data di <b>${escapeHtml(name)}</b> milik ${escapeHtml(selectedUid)}</p>` +
              tableOf(rows)
            : '<div class="empty">Tidak ada data di subkoleksi ini.</div>';
        } catch (e) {
          detailBox.innerHTML =
            '<div class="empty">Gagal memuat: ' + escapeHtml(e.message) + "</div>";
        }
      }

      usersBox.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-uid]");
        if (!btn) return;
        selectedUid = btn.dataset.uid;
        loadDetail();
        detailBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      document.getElementById("sub-name").addEventListener("change", loadDetail);

      loadUsers();
    });
  </script>
</body>
</html>
